<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ModernizeAI Knowledge Fabric Explorer</title>
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #network-canvas {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #0f172a 0%, #080c14 100%);
    }

    /* Top Floating Glassmorphic Control Bar */
    .control-dock {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
      z-index: 100;
    }
    .dock-group {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(51, 65, 85, 0.6);
      border-radius: 10px;
      padding: 6px 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    /* Search Component Input */
    .search-wrapper {
      position: relative;
    }
    .search-input {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid #334155;
      color: #f8fafc;
      border-radius: 6px;
      padding: 6px 12px 6px 30px;
      font-size: 12px;
      width: 240px;
      outline: none;
      transition: all 0.2s;
    }
    .search-input:focus {
      border-color: #38bdf8;
      width: 280px;
      background: rgba(30, 41, 59, 0.95);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }
    .search-icon {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 12px;
      color: #94a3b8;
      pointer-events: none;
    }
    .search-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 4px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      max-height: 220px;
      overflow-y: auto;
      display: none;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      z-index: 200;
    }
    .search-dropdown.active {
      display: block;
    }
    .search-item {
      padding: 7px 12px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(51, 65, 85, 0.4);
    }
    .search-item:hover {
      background: #1e293b;
      color: #38bdf8;
    }
    .search-badge {
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
    }

    /* Buttons */
    .ctrl-btn {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease-in-out;
    }
    .ctrl-btn:hover {
      background: #334155;
      color: #ffffff;
      border-color: #64748b;
    }
    .ctrl-btn.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
      color: #38bdf8;
    }

    /* Stats & Legend */
    .stats-pill {
      font-size: 11px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stats-val {
      color: #f8fafc;
      font-weight: 600;
    }

    /* Help Overlay bottom right */
    .help-tooltip {
      position: absolute;
      bottom: 14px;
      right: 14px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(51, 65, 85, 0.5);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      color: #64748b;
      pointer-events: none;
    }
    .help-tooltip strong {
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <!-- Floating Dock Controls -->
  <div class="control-dock">
    <div class="dock-group">
      <!-- Search Input -->
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" class="search-input" placeholder="Search class or table..." autocomplete="off" />
        <div id="search-dropdown" class="search-dropdown"></div>
      </div>

      <!-- Quick Toggles -->
      <button class="ctrl-btn" id="btn-toggle-tests" title="Toggle Test Classes">
        <span>🧪 Hide Tests</span>
      </button>
      <button class="ctrl-btn" id="btn-layout" title="Switch between Organic and Tiered Architecture">
        <span>📐 Hierarchical</span>
      </button>
      <button class="ctrl-btn" id="btn-freeze" title="Freeze or resume real-time physics">
        <span>❄️ Freeze</span>
      </button>
      <button class="ctrl-btn" id="btn-fit" title="Reset View and Fit All Nodes">
        <span>🎯 Fit View</span>
      </button>
    </div>

    <div class="dock-group">
      <div class="stats-pill">
        <span>Nodes: <span class="stats-val" id="count-nodes">80</span></span>
        <span>•</span>
        <span>Edges: <span class="stats-val" id="count-edges">86</span></span>
      </div>
    </div>
  </div>

  <div id="network-canvas"></div>

  <div class="help-tooltip">
    💡 Click any node to <strong>isolate neighborhood</strong> & trigger <strong>Inspector</strong>
  </div>

      var connectedEdges = network.getConnectedEdges(selectedId);
      var connectedSet = new Set(connectedNodes);
      connectedSet.add(selectedId);

      var selectedNodeObj = nodes.get(selectedId);

      // Dim non-connected nodes, highlight connected
      var nodeUpdates = [];
      nodes.forEach(function (n) {
        if (n.id === selectedId) {
          nodeUpdates.push({
            id: n.id,
            opacity: 1.0,
            size: (n.original_size || 20) * 1.35,
            borderWidth: 4,
            shadow: { enabled: true, color: '#38bdf8', size: 20 },
            font: { size: 14, color: '#ffffff', strokeWidth: 3, strokeColor: '#0f172a' }
          });
        } else if (connectedSet.has(n.id)) {
          nodeUpdates.push({
            id: n.id,
            opacity: 1.0,
            size: (n.original_size || 20) * 1.15,
            borderWidth: 2.5,
            shadow: { enabled: true, color: '#00f5d4', size: 10 },
            font: { size: 12, color: '#f8fafc', strokeWidth: 2, strokeColor: '#0f172a' }

            borderWidth: 1,

          });
        }
      });
      nodes.update(nodeUpdates);

      var edgeUpdates = [];
      edges.forEach(function (e) {

          edgeUpdates.push({

            font: {

            }
          });

            width: 0.4,

      var filteredEdges = rawEdges.filter(function (e) {
        return filteredNodeIds.has(e.from) && filteredNodeIds.has(e.to);
      });

      nodes.clear();
      nodes.add(filteredNodes);
      edges.clear();
      edges.add(filteredEdges);

      document.getElementById("count-nodes").textContent = filteredNodes.length;
      document.getElementById("count-edges").textContent = filteredEdges.length;

      restoreDefaults();
      network.fit({ animation: { duration: 500 } });
    });

    // 5. TOGGLE HIERARCHICAL LAYOUT
    var layoutBtn = document.getElementById("btn-layout");
    layoutBtn.addEventListener("click", function () {
      isHierarchical = !isHierarchical;
      layoutBtn.classList.toggle("active", isHierarchical);
      layoutBtn.innerHTML = isHierarchical ? "<span>🪐 Organic Force</span>" : "<span>📐 Hierarchical</span>";

      if (isHierarchical) {
        network.setOptions(hierarchicalOptions);
      } else {
        network.setOptions(forceOptions);
      }
      network.fit({ animation: { duration: 500 } });
    });

    // 6. FREEZE / THAW PHYSICS
    var freezeBtn = document.getElementById("btn-freeze");
    freezeBtn.addEventListener("click", function () {
      isFrozen = !isFrozen;
      freezeBtn.classList.toggle("active", isFrozen);
      freezeBtn.innerHTML = isFrozen ? "<span>🔥 Resume</span>" : "<span>❄️ Freeze</span>";
      network.setOptions({ physics: { enabled: !isFrozen } });
    });

    // 7. FIT VIEW
    document.getElementById("btn-fit").addEventListener("click", function () {
      network.fit({ animation: { duration: 500 } });
    });

    // 8. PARENT WINDOW MESSAGE LISTENER
    window.addEventListener("message", function (event) {
      var msg = event.data;
      if (!msg) return;

      if (msg.action === "freeze") {
        isFrozen = true;
        freezeBtn.classList.add("active");
        freezeBtn.innerHTML = "<span>🔥 Resume</span>";
        network.setOptions({ physics: { enabled: false } });
      } else if (msg.action === "unfreeze") {
        isFrozen = false;
        freezeBtn.classList.remove("active");
        freezeBtn.innerHTML = "<span>❄️ Freeze</span>";
        network.setOptions({ physics: { enabled: true } });
      } else if (msg.action === "toggle_tests") {
        if (msg.hideTests !== undefined && msg.hideTests !== hideTests) {
          toggleTestsBtn.click();
        }
      } else if (msg.action === "search_node" && msg.nodeId) {
        focusNode(msg.nodeId);
      }
    });
  </script>
</body>
</html>
